data:
  raw_dir: "data"
  time_column: "INSR_BEGIN"
  target_column: "CLAIM_PAID"

cleaning:
  max_missing_rate: 0.5
  min_unique_ratio: 0.10
  max_unique_ratio: 0.90

# Preprocessing for MLP: imputation, encoding, scaling. Column lists can be
# derived from dataset_schema (time/target excluded); optional overrides below.
preprocessing:
  scaler: "standard"   # standard | minmax
  # Optional: set to override schema-derived lists (e.g. for different train data)
  # numeric_features: []
  # categorical_features: []

report:
  dq_path: "reports/dq_report.md"

storage:
  db_path: "storage/mlops.sqlite"

logging:
  level: "INFO"
  log_file: "logs/mlops.log"
