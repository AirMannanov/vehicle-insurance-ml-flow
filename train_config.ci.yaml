dataset:
  selection_mode: "all"
  start_date: null
  end_date: null
  dates: []

validation:
  enabled: true
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  primary_metric: "f1"
  candidate_thresholds: [0.30, 0.40, 0.50]

models:
  enabled:
    - "catboost"
    - "mlp"

catboost:
  iterations: 25
  depth: 4
  learning_rate: 0.1
  l2_leaf_reg: 5.0
  scale_pos_weight: 1.0
  loss_function: "Logloss"
  random_seed: 42
  verbose: false

mlp:
  hidden_layer_sizes: [8]
  activation: "relu"
  solver: "adam"
  alpha: 0.0001
  batch_size: 8
  learning_rate_init: 0.001
  max_iter: 40
  early_stopping: false
  random_state: 42

output:
  artifacts_dir: "artifacts/ci_models"
