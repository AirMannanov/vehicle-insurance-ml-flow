dataset:
  selection_mode: "all"  # all | date_range | exact_dates
  start_date: null  # YYYY-MM-DD; используется только для date_range. null -> ограничение не задано
  end_date: null  # YYYY-MM-DD; используется только для date_range. если обе даты null, берем весь датасет
  dates: []  # Список дат YYYY-MM-DD; используется только для selection_mode: exact_dates

validation:
  enabled: true
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  primary_metric: "f1"
  candidate_thresholds: [0.05, 0.08, 0.10, 0.12, 0.15, 0.18, 0.20, 0.22, 0.25, 0.30, 0.35, 0.40, 0.50]

models:
  enabled:
    - "catboost"
    - "mlp"

catboost:
  iterations: 500
  depth: 6
  learning_rate: 0.05
  l2_leaf_reg: 20.0
  scale_pos_weight: 1.5
  loss_function: "Logloss"
  random_seed: 42
  verbose: false

mlp:
  hidden_layer_sizes: [128, 64]
  activation: "relu"  # Для sklearn MLPClassifier: identity | logistic | tanh | relu
  solver: "adam"  # Для sklearn MLPClassifier: lbfgs | sgd | adam
  alpha: 0.0001
  batch_size: 256
  learning_rate_init: 0.001
  max_iter: 30  # Для sklearn MLPClassifier это число эпох обучения
  early_stopping: true  # Остановить обучение раньше, если качество на validation fraction перестало улучшаться
  random_state: 42

output:
  artifacts_dir: "artifacts/models"
